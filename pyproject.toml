[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wowberg"
version = "0.1.0"
description = "Bloomberg Terminal for World of Warcraft"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "GitPython==3.1.43",
    "Authlib",
    "cryptography",
    "httpx",
    "requests",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true