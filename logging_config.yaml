version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "[%(asctime)s] {%(levelname)s} %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  detailed:
    format: "[%(asctime)s] {%(levelname)s} %(name)s [%(filename)s:%(lineno)d] %(funcName)s(): %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout
  
  auction_file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: "./logs/auction.log"
    mode: "a"
  
  blizzard_file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: "./logs/blizzard.log"
    mode: "a"

loggers:
  wowberg:
    level: INFO
    handlers:
      - console
    propagate: false
  
  wowberg.auction:
    level: DEBUG
    handlers:
      - console
      - auction_file
    propagate: false
  
  wowberg.blizzard:
    level: DEBUG
    handlers:
      - console
      - blizzard_file
    propagate: false

root:
  level: WARNING
  handlers:
    - console
