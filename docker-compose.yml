services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wowberg-api
    command: uvicorn api.run:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./src/api:/app/src/api
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: wowberg
      DB_USER: wowberg
      DB_PASSWORD: wowberg
    depends_on:
      - db

  wowberg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wowberg-main
    command: python -m wowberg.run
    volumes:
      - ./src/wowberg:/app/src/wowberg
    environment:
      APP_ENV: development

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: wowberg-db
    environment:
      POSTGRES_DB: wowberg
      POSTGRES_USER: wowberg
      POSTGRES_PASSWORD: wowberg
    ports:
      - "5432:5432"
    volumes:
      - wowberg-db-data:/var/lib/postgresql/data

volumes:
  wowberg-db-data:
