services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wowberg-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: wowberg
      DB_USER: wowberg
      DB_PASSWORD: wowberg
    depends_on:
      - db

  main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wowberg-main
    command: python -m main
    develop:
      watch:
        - action: restart
          path: ./src
    volumes:
      - ./src:/app/src
    environment:
      APP_ENV: development

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: wowberg-db
    environment:
      POSTGRES_DB: wowberg
      POSTGRES_USER: wowberg
      POSTGRES_PASSWORD: wowberg
    ports:
      - "5432:5432"
    volumes:
      - wowberg-db-data:/var/lib/postgresql/data

volumes:
  wowberg-db-data:
